databases:
  - name: trace-postgres
    databaseName: trace
    user: trace
    plan: free

services:
  # Web app: a fully static Next.js export. Render static sites are free and never sleep.
  - type: web
    name: trace-web-dapper
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NEXT_PUBLIC_TRACE_API_URL
        value: https://trace-api-dapper.onrender.com
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: trace-api-dapper
    runtime: docker
    plan: free
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/trace-render
    healthCheckPath: /v1/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trace-postgres
          property: connectionString
      - key: TRACE_ENV
        value: production
      - key: TRACE_BIND_ADDR
        value: 0.0.0.0:10000
      # Passkeys belong to the web app's domain: the browser runs WebAuthn there.
      - key: TRACE_PASSKEY_RP_ID
        value: trace-web-dapper.onrender.com
      - key: TRACE_PASSKEY_RP_ORIGIN
        value: https://trace-web-dapper.onrender.com
      - key: TRACE_CORS_ORIGINS
        value: https://trace-web-dapper.onrender.com,https://trace-api-dapper.onrender.com
      - key: TRACE_NEAR_NETWORK
        value: testnet
      - key: TRACE_NEAR_CONTRACT_ID
        value: trace-mandates-dapper.testnet
      - key: TRACE_NEAR_AGENT_ACCOUNT_ID
        value: trace-agent-dapper.testnet
      - key: TRACE_NEAR_DELEGATION_ENABLED
        value: "false"
      - key: TRACE_OPS_TOKEN
        generateValue: true
      - key: TRACE_RPC_ETHEREUM
        sync: false
      - key: TRACE_RPC_SOLANA
        sync: false
      - key: TRACE_PRICE_PROVIDER
        value: defillama
      - key: TRACE_EVM_MAX_BLOCK_RANGE
        value: "10"
      - key: TRACE_RETENTION_RAW_EVENT_DAYS
        value: "90"
      - key: TRACE_RETENTION_JOB_ATTEMPT_DAYS
        value: "14"
      - key: TRACE_RETENTION_AUDIT_EVENT_DAYS
        value: "180"
