[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/database",
  "crates/chain-adapters",
  "crates/accounting",
  "crates/intelligence",
  "crates/risk",
  "crates/signals",
  "crates/shadow",
  "crates/discovery",
  "crates/jobs",
  "services/api",
  "services/worker",
  "tools/fixture-capture",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
actix-web = "4"
actix-cors = "0.7"
anyhow = "1"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid", "rust_decimal", "json", "macros"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

trace-domain = { path = "crates/domain" }
trace-database = { path = "crates/database" }
trace-chain-adapters = { path = "crates/chain-adapters" }
trace-accounting = { path = "crates/accounting" }
trace-intelligence = { path = "crates/intelligence" }
trace-risk = { path = "crates/risk" }
trace-signals = { path = "crates/signals" }
trace-shadow = { path = "crates/shadow" }
trace-discovery = { path = "crates/discovery" }
trace-jobs = { path = "crates/jobs" }
