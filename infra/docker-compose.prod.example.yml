# Example only. Copy to docker-compose.prod.yml, put real values in .env.production
# (never commit it), and put TLS in front of the api (a reverse proxy or your platform's load balancer).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: trace
    volumes:
      - trace-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://trace:${POSTGRES_PASSWORD}@postgres:5432/trace
    ports: ["127.0.0.1:8080:8080"]

  worker:
    build: { context: .., target: worker }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://trace:${POSTGRES_PASSWORD}@postgres:5432/trace

volumes:
  trace-pg:
